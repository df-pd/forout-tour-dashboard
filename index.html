<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新北市資源教育基地 - 導覽統計儀表板</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1E40AF',
            'primary-light': '#3B82F6',
            accent: '#F59E0B',
            'accent-light': '#FCD34D',
            surface: '#F8FAFC',
            'text-primary': '#1E3A8A',
            'text-secondary': '#64748B',
          },
          fontFamily: {
            sans: ['Fira Sans', 'Noto Sans TC', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Fira Sans', 'Noto Sans TC', sans-serif;
      background-color: #F8FAFC;
      color: #1E3A8A;
    }

    /* 骨架屏動畫 */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 0.5rem;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* KPI 卡片 hover */
    .kpi-card {
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px -5px rgba(30, 64, 175, 0.15);
    }

    /* 表格行 hover */
    .data-row:hover {
      background-color: #EFF6FF;
    }

    /* 手風琴動畫 */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 300ms ease-out, padding 300ms ease-out;
    }
    .accordion-content.open {
      max-height: 500px;
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }

    /* 篩選按鈕 */
    .filter-btn {
      transition: all 150ms ease;
    }
    .filter-btn.active {
      background-color: #1E40AF;
      color: white;
    }

    /* 分頁 */
    .page-btn {
      transition: all 150ms ease;
    }
    .page-btn.active {
      background-color: #1E40AF;
      color: white;
    }

    /* 響應式滾動表格 */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 搜尋欄位焦點 */
    .search-input:focus {
      outline: none;
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Tab 切換 */
    .tab-btn {
      transition: all 200ms ease;
      position: relative;
    }
    .tab-btn.active {
      color: #1E40AF;
      font-weight: 600;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 3px;
      background-color: #1E40AF;
      border-radius: 3px 3px 0 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton, .kpi-card, .accordion-content, .filter-btn, .tab-btn {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

          <div>

      <!-- 導覽記錄表格 -->

    <!-- ===== 導覽 QA Tab ===== -->

  <!-- 頁尾 -->

      <p class="text-xs text-text-secondary text-center">
        新北市資源教育基地 導覽統計系統 &copy; <span id="footerYear"></span>

  <script>
    // ============================================================
    // 設定區 - 修改這裡的 Google Sheets 資訊
    // ============================================================
    const CONFIG = {
      // Google Sheet ID（原始試算表 ID）
      SHEET_ID: '1SlGXwWgjjqoywFYx3nkE-7YolFfdLkK-Q1JuaT4Kt5Y',

      // Google Sheet 已發佈金鑰（備援用）
      PUBLISHED_KEY: '2PACX-1vRs6O6yhomyci12NhBmog0EmqIJVRCL9qzBfLoCwY_A1NMwHXGfqbXw2yiH18kN61Sb09u6s_3rqfls',

      // 導覽記錄工作表 gid
      TOUR_SHEET_GID: '693491083',

      // 導覽 QA 工作表 gid（日後新增 QA 工作表後填入）
      QA_SHEET_GID: '',

      // 每頁顯示筆數
      PAGE_SIZE: 15,
    };

    // ============================================================
    // 全域狀態
    // ============================================================
    let tourData = [];         // 導覽記錄原始資料
    let qaData = [];           // QA 原始資料
    let filteredTourData = []; // 篩選後的導覽資料
    let filteredQAData = [];   // 篩選後的 QA 資料
    let currentPage = 1;
    let sortCol = -1;
    let sortAsc = true;
    let activeQAFilter = 'all';
    let monthlyChart = null;
    let unitChart = null;

    // ============================================================
    // 資料載入
    // ============================================================

    /**
     * 使用 JSONP script 注入方式讀取已發佈的 Google Sheets
     * 備援方案：已發佈的 CSV 端點
     */
    function loadSheetData(gid) {
      return new Promise((resolve, reject) => {
        const callbackName = '_gsheetCb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');

        script.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&gid=${gid}`;

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('載入逾時'));
        }, 10000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(response) {
          cleanup();
          if (response.status === 'ok' && response.table) {
            resolve(response.table);
          } else {
            reject(new Error(response.errors?.[0]?.message || '資料讀取失敗'));
          }
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('Script 載入失敗'));
        };

        document.head.appendChild(script);
      });
    }

    /**
     * 備援：透過已發佈的 CSV 端點讀取資料
     */
    async function loadSheetCSV(gid) {
      const url = `https://docs.google.com/spreadsheets/d/e/${CONFIG.PUBLISHED_KEY}/pub?gid=${gid}&single=true&output=csv`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      return parseCSV(text);
    }

    /**
     * 簡易 CSV 解析
     */
    function parseCSV(text) {
      const rows = [];
      let current = '';
      let inQuotes = false;
      const chars = text.split('');

      for (let i = 0; i < chars.length; i++) {
        const c = chars[i];
        if (c === '"') {
          if (inQuotes && chars[i + 1] === '"') { current += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          if (!rows.length || rows[rows.length - 1] === null) rows.push([current]);
          else rows[rows.length - 1].push(current);
          current = '';
        } else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (c === '\r' && chars[i + 1] === '\n') i++;
          if (!rows.length || rows[rows.length - 1] === null) rows.push([current]);
          else rows[rows.length - 1].push(current);
          current = '';
          rows.push(null);
        } else {
          current += c;
        }
      }
      if (current || (rows.length && rows[rows.length - 1] !== null)) {
        if (!rows.length || rows[rows.length - 1] === null) rows.push([current]);
        else rows[rows.length - 1].push(current);
      }
      return rows.filter(r => r !== null && r.some(cell => cell.trim() !== ''));
    }

    /**
     * 將 Google Visualization table 轉換為二維陣列
     */
    function tableToRows(table) {
      const header = table.cols.map(c => c.label || '');
      const rows = [header];

      table.rows.forEach(row => {
        const cells = row.c.map(cell => {
          if (!cell) return '';
          if (cell.f !== undefined && cell.f !== null) return String(cell.f);
          if (cell.v !== undefined && cell.v !== null) return String(cell.v);
          return '';
        });
        rows.push(cells);
      });

      return rows;
    }

    /**
     * 載入導覽記錄資料
     */
    async function loadTourData() {
      try {
        let rows;

        try {
          // 優先使用 JSONP 方式
          const table = await loadSheetData(CONFIG.TOUR_SHEET_GID);
          rows = tableToRows(table);
        } catch (e) {
          // 備援：使用已發佈的 CSV
          console.warn('JSONP 讀取失敗，切換 CSV 備援:', e.message);
          rows = await loadSheetCSV(CONFIG.TOUR_SHEET_GID);
        }

        if (rows.length < 2) {
          tourData = [];
          return;
        }

        tourData = rows.slice(1).map((row, i) => ({
          session: row[0]?.trim() || String(i + 1),
          date: row[1]?.trim() || '',
          name: row[2]?.trim() || '',
          unit: row[3]?.trim() || '',
          people: parseInt(row[4]?.trim()) || 0,
        })).filter(r => r.date || r.name || r.unit);

        filteredTourData = [...tourData];
      } catch (err) {
        console.error('載入導覽記錄失敗:', err);
        tourData = [];
        filteredTourData = [];
      }
    }

    /**
     * 載入 QA 資料
     */
    async function loadQAData() {
      // QA 工作表 gid 尚未設定，跳過
      if (!CONFIG.QA_SHEET_GID) {
        qaData = [];
        filteredQAData = [];
        return;
      }

      try {
        let rows;

        try {
          const table = await loadSheetData(CONFIG.QA_SHEET_GID);
          rows = tableToRows(table);
        } catch (e) {
          console.warn('QA JSONP 讀取失敗，切換 CSV 備援:', e.message);
          rows = await loadSheetCSV(CONFIG.QA_SHEET_GID);
        }

        if (rows.length < 2) {
          qaData = [];
          return;
        }

        qaData = rows.slice(1).map((row, i) => ({
          id: row[0]?.trim() || String(i + 1),
          question: row[1]?.trim() || '',
          answer: row[2]?.trim() || '',
          category: row[3]?.trim() || '未分類',
        })).filter(r => r.question);

        filteredQAData = [...qaData];
      } catch (err) {
        console.error('載入 QA 資料失敗:', err);
        qaData = [];
        filteredQAData = [];
      }
    }

    // ============================================================
    // 渲染 KPI
    // ============================================================
    function renderKPIs() {
      const totalSessions = tourData.length;
      const totalPeople = tourData.reduce((sum, r) => sum + r.people, 0);
      const avg = totalSessions > 0 ? (totalPeople / totalSessions).toFixed(1) : '0';

      // 計算本月場次
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      const monthSessions = tourData.filter(r => {
        const d = parseDate(r.date);
        return d && d.getMonth() === currentMonth && d.getFullYear() === currentYear;
      }).length;

      document.getElementById('kpi-sessions').textContent = totalSessions.toLocaleString();
      document.getElementById('kpi-people').textContent = totalPeople.toLocaleString();
      document.getElementById('kpi-avg').textContent = avg;
      document.getElementById('kpi-month').textContent = monthSessions.toLocaleString();
    }

    /**
     * 解析各種日期格式
     */
    function parseDate(str) {
      if (!str) return null;
      // 嘗試 yyyy/MM/dd、yyyy-MM-dd、MM/dd、M/d 等格式
      let d;

      // yyyy/MM/dd 或 yyyy-MM-dd
      d = new Date(str.replace(/\//g, '-'));
      if (!isNaN(d.getTime())) return d;

      // MM/dd（補上今年）
      const parts = str.split(/[\/\-\.]/);
      if (parts.length === 2) {
        const month = parseInt(parts[0]) - 1;
        const day = parseInt(parts[1]);
        d = new Date(new Date().getFullYear(), month, day);
        if (!isNaN(d.getTime())) return d;
      }

      // 帶有中文的格式：3月5日
      const match = str.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
      if (match) {
        d = new Date(new Date().getFullYear(), parseInt(match[1]) - 1, parseInt(match[2]));
        if (!isNaN(d.getTime())) return d;
      }

      return null;
    }

    // ============================================================
    // 渲染圖表
    // ============================================================
    function renderCharts() {
      renderMonthlyChart();
      renderUnitChart();
    }

    function renderMonthlyChart() {
      // 按月份統計
      const monthMap = {};
      tourData.forEach(r => {
        const d = parseDate(r.date);
        if (!d) return;
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (!monthMap[key]) monthMap[key] = { sessions: 0, people: 0 };
        monthMap[key].sessions++;
        monthMap[key].people += r.people;
      });

      const sortedKeys = Object.keys(monthMap).sort();
      const labels = sortedKeys.map(k => {
        const [y, m] = k.split('-');
        return `${parseInt(m)}月`;
      });

      const ctx = document.getElementById('chartMonthly');
      if (monthlyChart) monthlyChart.destroy();

      monthlyChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: '人數',
              data: sortedKeys.map(k => monthMap[k].people),
              borderColor: '#1E40AF',
              backgroundColor: 'rgba(30, 64, 175, 0.08)',
              fill: true,
              tension: 0.3,
              pointBackgroundColor: '#1E40AF',
              pointRadius: 4,
              pointHoverRadius: 6,
            },
            {
              label: '場次',
              data: sortedKeys.map(k => monthMap[k].sessions),
              borderColor: '#F59E0B',
              backgroundColor: 'transparent',
              borderDash: [5, 5],
              tension: 0.3,
              pointBackgroundColor: '#F59E0B',
              pointRadius: 4,
              pointHoverRadius: 6,
              yAxisID: 'y1',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top', labels: { usePointStyle: true, padding: 16, font: { size: 12 } } },
            tooltip: {
              backgroundColor: '#1E3A8A',
              titleFont: { size: 13 },
              bodyFont: { size: 12 },
              padding: 12,
              cornerRadius: 8,
            }
          },
          scales: {
            y: {
              title: { display: true, text: '人數', font: { size: 11 } },
              ticks: { font: { size: 11 } },
              grid: { color: 'rgba(0,0,0,0.04)' },
            },
            y1: {
              position: 'right',
              title: { display: true, text: '場次', font: { size: 11 } },
              ticks: { font: { size: 11 }, stepSize: 1 },
              grid: { display: false },
            },
            x: {
              ticks: { font: { size: 11 } },
              grid: { display: false },
            }
          }
        }
      });
    }

    function renderUnitChart() {
      // 按單位統計，取前 10
      const unitMap = {};
      tourData.forEach(r => {
        if (!r.unit) return;
        if (!unitMap[r.unit]) unitMap[r.unit] = 0;
        unitMap[r.unit] += r.people;
      });

      const sorted = Object.entries(unitMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      const ctx = document.getElementById('chartUnit');
      if (unitChart) unitChart.destroy();

      const colors = [
        '#1E40AF', '#3B82F6', '#60A5FA', '#93C5FD', '#BFDBFE',
        '#F59E0B', '#FBBF24', '#FCD34D', '#FDE68A', '#FEF3C7'
      ];

      unitChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sorted.map(([unit]) => unit.length > 8 ? unit.slice(0, 8) + '...' : unit),
          datasets: [{
            label: '總人數',
            data: sorted.map(([, count]) => count),
            backgroundColor: colors.slice(0, sorted.length),
            borderRadius: 6,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1E3A8A',
              callbacks: {
                title: (items) => {
                  const idx = items[0].dataIndex;
                  return sorted[idx][0]; // 顯示完整名稱
                },
                label: (item) => ` ${item.raw.toLocaleString()} 人次`
              }
            }
          },
          scales: {
            x: {
              ticks: { font: { size: 11 } },
              grid: { color: 'rgba(0,0,0,0.04)' },
            },
            y: {
              ticks: { font: { size: 11 } },
              grid: { display: false },
            }
          }
        }
      });
    }

    // ============================================================
    // 渲染表格
    // ============================================================
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const start = (currentPage - 1) * CONFIG.PAGE_SIZE;
      const end = start + CONFIG.PAGE_SIZE;
      const pageData = filteredTourData.slice(start, end);

      if (pageData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="px-5 py-12 text-center text-text-secondary text-sm">
              <div class="flex flex-col items-center">
                <svg class="w-10 h-10 text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                </svg>
                尚無資料
              </div>
            </td>
          </tr>`;
      } else {
        tbody.innerHTML = pageData.map(r => `
          <tr class="data-row border-b border-slate-50 transition-colors">
            <td class="px-5 py-3 font-mono text-sm font-medium">${escapeHTML(r.session)}</td>
            <td class="px-5 py-3 text-sm">${escapeHTML(r.date)}</td>
            <td class="px-5 py-3 text-sm">${escapeHTML(r.name)}</td>
            <td class="px-5 py-3 text-sm">${escapeHTML(r.unit)}</td>
            <td class="px-5 py-3 text-sm text-right font-mono font-medium">${r.people.toLocaleString()}</td>
          </tr>
        `).join('');
      }

      // 分頁資訊
      const totalPages = Math.max(1, Math.ceil(filteredTourData.length / CONFIG.PAGE_SIZE));
      document.getElementById('pageInfo').textContent =
        `共 ${filteredTourData.length} 筆，第 ${currentPage}/${totalPages} 頁`;

      // 分頁按鈕
      const pag = document.getElementById('pagination');
      let pagHTML = '';
      if (totalPages > 1) {
        pagHTML += `<button class="page-btn px-3 py-1 text-xs rounded border border-slate-200 cursor-pointer ${currentPage === 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'}" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&laquo;</button>`;

        for (let i = 1; i <= totalPages; i++) {
          if (totalPages > 7 && i > 3 && i < totalPages - 1 && Math.abs(i - currentPage) > 1) {
            if (i === 4 || i === totalPages - 2) pagHTML += `<span class="px-1 text-xs text-text-secondary">...</span>`;
            continue;
          }
          pagHTML += `<button class="page-btn px-3 py-1 text-xs rounded border border-slate-200 cursor-pointer ${i === currentPage ? 'active' : 'hover:bg-slate-100'}" onclick="goPage(${i})">${i}</button>`;
        }

        pagHTML += `<button class="page-btn px-3 py-1 text-xs rounded border border-slate-200 cursor-pointer ${currentPage === totalPages ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100'}" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&raquo;</button>`;
      }
      pag.innerHTML = pagHTML;
    }

    function goPage(page) {
      const totalPages = Math.ceil(filteredTourData.length / CONFIG.PAGE_SIZE);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
    }

    // ============================================================
    // 表格搜尋與排序
    // ============================================================
    function filterTable() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      filteredTourData = tourData.filter(r =>
        !q ||
        r.name.toLowerCase().includes(q) ||
        r.unit.toLowerCase().includes(q) ||
        r.date.includes(q) ||
        r.session.includes(q)
      );
      currentPage = 1;
      renderTable();
    }

    function sortTable(colIdx) {
      if (sortCol === colIdx) {
        sortAsc = !sortAsc;
      } else {
        sortCol = colIdx;
        sortAsc = true;
      }

      const keys = ['session', 'date', 'name', 'unit', 'people'];
      const key = keys[colIdx];

      filteredTourData.sort((a, b) => {
        let va = a[key], vb = b[key];

        if (key === 'people') {
          return sortAsc ? va - vb : vb - va;
        }
        if (key === 'date') {
          const da = parseDate(va), db = parseDate(vb);
          if (da && db) return sortAsc ? da - db : db - da;
        }
        if (key === 'session') {
          const na = parseInt(va), nb = parseInt(vb);
          if (!isNaN(na) && !isNaN(nb)) return sortAsc ? na - nb : nb - na;
        }

        va = String(va).toLowerCase();
        vb = String(vb).toLowerCase();
        return sortAsc ? va.localeCompare(vb, 'zh-TW') : vb.localeCompare(va, 'zh-TW');
      });

      currentPage = 1;
      renderTable();
    }

    // ============================================================
    // QA 渲染
    // ============================================================
    function renderQA() {
      const container = document.getElementById('qaList');
      const emptyState = document.getElementById('qaEmpty');

      // 分類按鈕
      const categories = [...new Set(qaData.map(r => r.category))];
      const filterContainer = document.getElementById('qaCategoryFilters');
      filterContainer.innerHTML = categories.map(cat =>
        `<button class="filter-btn px-4 py-1.5 text-sm rounded-full border border-slate-200 bg-white cursor-pointer" onclick="filterQA('${escapeHTML(cat)}')">${escapeHTML(cat)}</button>`
      ).join('');

      renderQAList();
    }

    function renderQAList() {
      const container = document.getElementById('qaList');
      const emptyState = document.getElementById('qaEmpty');

      if (filteredQAData.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = filteredQAData.map((item, i) => `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <button
            class="w-full px-5 py-4 flex items-center justify-between text-left cursor-pointer hover:bg-slate-50 transition-colors"
            onclick="toggleAccordion(${i})"
          >
            <div class="flex items-center gap-3">
              <span class="flex-shrink-0 w-7 h-7 bg-blue-50 rounded-full flex items-center justify-center text-xs font-bold text-primary font-mono">${escapeHTML(item.id)}</span>
              <span class="text-sm font-medium text-text-primary">${escapeHTML(item.question)}</span>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0 ml-3">
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-text-secondary">${escapeHTML(item.category)}</span>
              <i data-lucide="chevron-down" class="w-4 h-4 text-text-secondary transition-transform accordion-icon-${i}"></i>
            </div>
          </button>
          <div class="accordion-content px-5 border-t border-slate-100" id="accordion-${i}">
            <p class="text-sm text-text-secondary leading-relaxed pl-10">${escapeHTML(item.answer)}</p>
          </div>
        </div>
      `).join('');

      // 重新初始化 Lucide 圖示
      lucide.createIcons();
    }

    function toggleAccordion(index) {
      const el = document.getElementById(`accordion-${index}`);
      const icon = document.querySelector(`.accordion-icon-${index}`);
      el.classList.toggle('open');
      if (icon) {
        icon.style.transform = el.classList.contains('open') ? 'rotate(180deg)' : '';
      }
    }

    function filterQA(category) {
      activeQAFilter = category;

      // 更新按鈕狀態
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (
          (category === 'all' && btn.textContent.trim() === '全部') ||
          btn.textContent.trim() === category
        ) {
          btn.classList.add('active');
        }
      });

      applyQAFilters();
    }

    function filterQABySearch() {
      applyQAFilters();
    }

    function applyQAFilters() {
      const q = document.getElementById('qaSearchInput').value.trim().toLowerCase();

      filteredQAData = qaData.filter(r => {
        const matchCat = activeQAFilter === 'all' || r.category === activeQAFilter;
        const matchSearch = !q ||
          r.question.toLowerCase().includes(q) ||
          r.answer.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      renderQAList();
    }

    // ============================================================
    // Tab 切換
    // ============================================================
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
        if (btn.dataset.tab !== tab) {
          btn.classList.add('text-text-secondary');
        } else {
          btn.classList.remove('text-text-secondary');
        }
      });

      document.getElementById('tab-stats').classList.toggle('hidden', tab !== 'stats');
      document.getElementById('tab-qa').classList.toggle('hidden', tab !== 'qa');
    }

    // ============================================================
    // 工具函式
    // ============================================================
    function escapeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ============================================================
    // 初始化與重新整理
    // ============================================================
    async function refreshData() {
      const icon = document.getElementById('refreshIcon');
      icon.style.animation = 'spin 1s linear infinite';

      await Promise.all([loadTourData(), loadQAData()]);

      renderKPIs();
      renderCharts();
      filterTable(); // 套用搜尋篩選
      renderQA();

      icon.style.animation = '';

      const now = new Date();
      document.getElementById('lastUpdate').textContent =
        `最後更新：${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      document.getElementById('lastUpdate').classList.remove('hidden');
    }

    // 頁面載入
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('footerYear').textContent = new Date().getFullYear();
      lucide.createIcons();
      refreshData();
    });
  </script>
</body>
